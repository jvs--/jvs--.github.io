services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    # --force_polling: detect file changes reliably through the mounted volume
    # (filesystem events don't propagate through the Colima mount).
    command: bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    ports:
      - "4000:4000"     # site
      - "35729:35729"   # livereload
    volumes:
      - .:/srv/jekyll              # the repo (live-edited)
      - bundle:/usr/local/bundle   # persisted gem cache -> fast subsequent runs

volumes:
  bundle:
