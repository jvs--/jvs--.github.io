    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>

    <ul class="nav-links" id="navLinks">
      <li><a class="nav-link {% if url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a></li>
      <li><a class="nav-link {% if url contains '/work' %}active{% endif %}" href="{{ '/work/' | relative_url }}">Work</a></li>
      <li><a class="nav-link {% if url contains '/about' %}active{% endif %}" href="{{ '/about/' | relative_url }}">About</a></li>
      <li><a class="nav-link {% if url contains '/contact' %}active{% endif %}" href="{{ '/contact/' | relative_url }}">Contact</a></li>
    </ul>
  </div>
